# Banco H2 em memória para os testes não dependerem do MySQL.
spring.datasource.url=jdbc:h2:mem:apitest;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER

# Driver responsável pela conexão com o H2.
spring.datasource.driver-class-name=org.h2.Driver

# Credenciais padrão do banco H2 em memória.
spring.datasource.username=sa
spring.datasource.password=

# Cria as tabelas no início e remove ao encerrar o contexto.
spring.jpa.hibernate.ddl-auto=create-drop

# Desativa a exibição dos comandos SQL durante os testes.
spring.jpa.show-sql=false

# Evita manter a sessão do banco aberta além da camada de serviço.
spring.jpa.open-in-view=false